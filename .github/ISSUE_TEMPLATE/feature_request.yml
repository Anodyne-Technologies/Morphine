name: Feature Request
description: Suggest an enhancement or new workflow capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Workflow Bottleneck
      description: What are you trying to accomplish that is difficult or impossible right now?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you'd like this to behave.
    validations:
      required: true
